services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ucms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ucms_db}
      POSTGRES_USER: ${DB_USERNAME:-ucms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ucms_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ucms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ucms_user} -d ${DB_DATABASE:-ucms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:alpine
    container_name: ucms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ucms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  laravel-api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: ucms_laravel_api
    restart: unless-stopped
    env_file:
      - ./api/.env
    volumes:
      - ./api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ucms_network
    
  python-ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ucms_python_ai
    restart: unless-stopped
    env_file:
      - ./ai/.env
    environment:
      - HF_HOME=/app/hf_cache
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: '2gb'
    volumes:
      - ./ai:/app
      - hf_cache:/app/hf_cache
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ucms_network

  nginx:
    image: nginx:alpine
    container_name: ucms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    depends_on:
      - laravel-api
      - python-ai
    networks:
      - ucms_network

networks:
  ucms_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  hf_cache: